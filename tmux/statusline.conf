# vim: ft=tmux
# CHANGED: 调整颜色以匹配 github-theme
set -g mode-style "fg=#c9d1d9,bg=#1f2428"

set -g message-style "fg=#c9d1d9,bg=#1f2428"
set -g message-command-style "fg=#c9d1d9,bg=#1f2428"

set -g pane-border-style "fg=#1f2428"
set -g pane-active-border-style "fg=#c9d1d9"

set -g status-interval 1
set -g status-justify "left"

# CHANGED: 使用 github-theme 的背景和前景色
set -g status-style "fg=#8b949e,bg=#1f2428"
set -g status-bg "#0d1117"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

# CHANGED: 调整状态栏左侧颜色
set -g status-left "#[fg=#1f2428,bg=#c9d1d9,bold] #S #[fg=#c9d1d9,bg=#8b949e,nobold,nounderscore,noitalics]#[fg=#0d1117,bg=#8b949e,bold] #(whoami) #[fg=#8b949e,bg=#0d1117]"
# CHANGED: 调整状态栏右侧颜色
set -g status-right "#[fg=#8b949e,bg=#0d1117,nobold,nounderscore,noitalics]#[fg=#8b949e,bg=#1f2428]#[fg=#8b949e,bg=#1f2428,nobold,nounderscore,noitalics]#[fg=#c9d1d9,bg=#1f2428]#[fg=#1f2428,bg=#c9d1d9,bold] #h "

# CHANGED: 调整窗口状态颜色
setw -g window-status-activity-style "underscore,fg=#8b949e,bg=#0d1117"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#8b949e,bg=#0d1117"
setw -g window-status-format '#[fg=#0d1117,bg=#0d1117]#[default] #I  #{b:pane_current_path} #[fg=#0d1117,bg=#0d1117,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#0d1117,bg=#c9d1d9]#[fg=#0d1117,bg=#c9d1d9] #I #[fg=#c9d1d9,bg=#2ea043] #{b:pane_current_path} #[fg=#2ea043,bg=#0d1117,nobold]'
